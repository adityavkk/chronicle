[package]
name = "chronicle-vfs-tests"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
chronicle-raft = { path = "../.." }
libsqlite3-sys = { version = "=0.35.0", features = ["bundled"] }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
cc = "=1.6.0"
