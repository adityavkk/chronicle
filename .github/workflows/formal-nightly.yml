name: Formal (nightly)

# The heavy formal model checks that are too slow to gate every push run here on
# a schedule instead. The per-push CI (ci.yml) runs the fast subset:
# `make tlc38-fast`, plus tlc / lean-proofs / formal-verification. This nightly
# job runs the parts that take many minutes:
#   - make tlc38-heavy : the scaled 2/2/2 Composed layering proof (#38),
#                        about 25.9M distinct states each for fence-on and
#                        fence-off, roughly 18 minutes on a runner.
#   - make tlc40       : the membership / HRW convergence spec and the L3
#                        lease-tail refinement (#40).
#   - make fence-2x2   : the write-fence append capability with TWO authorities
#                        on one stream (#183: the per-authority invariants under
#                        cross-authority interleaving of the shared producer
#                        state and log), ~10.8M distinct states; the 1x2 PR gate
#                        and the fault controls run in ci.yml.
#   - apalache         : the #41 inductive-invariant proof of []SingleHolder
#                        (FenceCore.tla); apalache-mc is downloaded to /tmp by
#                        formal/tla/apalache/run.sh and never committed. Green
#                        iff the runner prints ALL APALACHE OBLIGATIONS PASS.
# A violation in any of them fails the job, the same as the per-push checks.
#
# Trigger it by hand from the Actions tab (workflow_dispatch) to confirm a
# change before the next nightly.

on:
  schedule:
    - cron: "41 7 * * *" # nightly at 07:41 UTC (off the :00 / :30 marks)
  workflow_dispatch:

jobs:
  heavy-formal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal/tla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache tla2tools.jar
        uses: actions/cache@v4
        with:
          path: formal/tla/tla2tools.jar
          key: tla2tools-v1.7.4
      - name: TLA+ heavy — scaled 2/2/2 layering proof (#38) + membership/HRW convergence (#40) + write-fence two authorities on one stream (#183)
        run: make tlc38-heavy tlc40 fence-2x2

  # The Apalache lane (issue #41): the three inductive obligations, the scope
  # corroborations, the non-vacuity witnesses and the INV-FENCE-04 negative
  # control, discharged symbolically (SMT) rather than by enumeration. Its own
  # job so the JVM tool download and the Z3 runs never sit on the TLC path.
  apalache:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal/tla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Apalache inductive proof of []SingleHolder (FenceCore.tla, #41) — tool fetched to /tmp, never committed
        env:
          APALACHE_VERSION: "0.58.2"
        run: bash apalache/run.sh
