\* FAULT-INJECTION config (rule 5 negative test: the "omit the credential /
\* autoClaim" hole). BindProducers = FALSE drops the wfbind check, so an
\* open-class append naming a producer id that a fenced write already bound is
\* admitted by the base producer state machine alone: a deposed writer can bump
\* its epoch past the claim generation without any token. This MUST produce a
\* BoundProducerNeverOpen counterexample (the bound producer runs ahead of the
\* fenced log). Faithful runs use BindProducers = TRUE.
\* Run: java -cp tla2tools.jar tlc2.TLC -config WriteFence_fault_nobind.cfg MC_WriteFence.tla
SPECIFICATION Spec

CONSTANTS
    Workers = {w1, w2}
    Auths   = {a1}
    MaxGen         = 3
    MaxSeq         = 2
    MaxCrashes     = 0
    CheckInSlot    = TRUE
    BindProducers  = FALSE
    SealBeforeIdle = TRUE
    SealOnRevoke   = TRUE

SYMMETRY Sym

INVARIANT BoundProducerNeverOpen

CONSTRAINT StateConstraint
