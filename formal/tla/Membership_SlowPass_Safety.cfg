\* Slow-pass safety twin for the Membership spec: the Tick slot-lease headroom
\* gate is REMOVED (TickUngated = Tick \/ SlowPassLapse), so an alive,
\* still-targeted owner's slot lease may lapse between its own renewals -- a
\* pass whose claims land more than slotLeaseTTL after the previous pass's
\* start, where that pass's leases are anchored (the condition is stated in full
\* in the Membership.tla header). The safety invariants and the epoch
\* action-properties MUST still hold: none of them reads the gate, so pass
\* timing can only cause churn (self-renew, or a fenced transfer), never a
\* safety break.
\* Same constants and constraint as Membership_Safety.cfg.
SPECIFICATION SpecSlowPassNoFair

CONSTANTS
    Replicas <- MCReplicas
    Slots <- MCSlots
    Score <- MCScore
    MemberTTL = 2
    SlotTTL = 2
    MaxEpoch = 8
    MaxChurn = 4

INVARIANT Inv
PROPERTY EpochMonotoneProp
PROPERTY TransferBumpsEpochProp

CONSTRAINT StateConstraint
