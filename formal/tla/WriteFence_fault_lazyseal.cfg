\* FAULT-INJECTION config (INV-FENCE-06 ordering negative test).
\* SealBeforeIdle = FALSE runs the done sequence the wrong way round: ack.lua
\* idles the claim first, seal_append_fence.lua runs second. Between the two
\* (and permanently, if the origin crashes there) the subscription is idle and
\* claimable while its marker is still live and its lease unexpired -- the
\* deposed holder's token still authorizes writes on a claim that has ended.
\* This MUST produce a SealPrecedesIdle counterexample, proving the seal must
\* be durable before the control plane idles. Faithful runs use
\* SealBeforeIdle = TRUE.
\* Run: java -cp tla2tools.jar tlc2.TLC -config WriteFence_fault_lazyseal.cfg MC_WriteFence.tla
SPECIFICATION Spec

CONSTANTS
    Workers = {w1, w2}
    Auths   = {a1}
    MaxGen         = 3
    MaxSeq         = 2
    MaxCrashes     = 1
    CheckInSlot    = TRUE
    BindProducers  = TRUE
    SealBeforeIdle = FALSE
    SealOnRevoke   = TRUE

SYMMETRY Sym

INVARIANT SealPrecedesIdle

CONSTRAINT StateConstraint
