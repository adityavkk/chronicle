\* Slow-pass convergence twin for the Membership spec (negative control, in the
\* membership-nofair style): the Tick slot-lease headroom gate is REMOVED
\* (TickUngated) while the same fairness is kept (WF on TickUngated in place of
\* Tick). EventualConvergence MUST FAIL: TLC's counterexample is an alive HRW
\* owner whose slot lease lapses (slotTTL reaches 0) and is renewed again,
\* forever -- the lapse/renew oscillation of passes whose claims land more than
\* slotLeaseTTL after the previous pass's start, where that pass's leases are
\* anchored (the condition is stated in full in the Membership.tla header). It
\* proves the gate is exactly what []Converged needs and doubles as the gate's
\* non-vacuity witness. The Makefile target requires the failure to be a
\* TEMPORAL violation whose trace contains a SlowPassLapse step (the tick Tick
\* forbids, named apart so TLC prints it); TypeOK is checked too, as in the
\* gated twin, so a type violation can never pose as the expected failure.
\* Same constants as Membership_Convergence.cfg; no CONSTRAINT during liveness.
SPECIFICATION SpecSlowPass

CONSTANTS
    Replicas <- MCReplicas
    Slots <- MCSlots
    Score <- MCScore
    MemberTTL = 2
    SlotTTL = 2
    MaxEpoch = 8
    MaxChurn = 4

INVARIANT TypeOK
PROPERTY EventualConvergence
