\* TLC config: 1 authority x 2 workers, the PR gate (issue #183, INV-FENCE-05/06).
\* Exercises takeover, the seal-before-ack done sequence and its origin-crash
\* redelivery, the delayed-grant and delayed-seal snapshot races, the marker's
\* own lease lapse with the heartbeat reinstall, and the tombstone reaper, with
\* two claimants racing one fenced stream.
\* Run: java -cp tla2tools.jar tlc2.TLC -config WriteFence_1x2.cfg MC_WriteFence.tla
SPECIFICATION Spec

CONSTANTS
    Workers = {w1, w2}
    Auths   = {a1}
    MaxGen          = 3
    MaxSeq          = 2
    MaxCrashes      = 1
    CheckInSlot     = TRUE
    BindProducers   = TRUE
    SealBeforeIdle  = TRUE
    SealOnRevoke    = TRUE
    SealKeyedByAuth = TRUE

SYMMETRY Sym

INVARIANT Inv

PROPERTY
    GenMonotoneProp
    SealedIsFinalProp

CONSTRAINT StateConstraint
