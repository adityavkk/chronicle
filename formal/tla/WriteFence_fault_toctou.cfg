\* FAULT-INJECTION config (INV-FENCE-05 negative test, the #169 shape).
\* CheckInSlot = FALSE splits the fenced append into an out-of-slot admission
\* check and a later write that does not re-check. Between the two the lease
\* can lapse and a successor can be granted and write, so the deposed writer's
\* commit lands AFTER the successor's: a lower generation follows a higher one
\* in the log. This MUST produce an EpochsDoNotInterleave counterexample,
\* proving the in-slot fence block is load-bearing. Faithful runs use
\* CheckInSlot = TRUE.
\* Run: java -cp tla2tools.jar tlc2.TLC -config WriteFence_fault_toctou.cfg MC_WriteFence.tla
SPECIFICATION Spec

CONSTANTS
    Workers = {w1, w2}
    Auths   = {a1}
    MaxGen         = 3
    MaxSeq         = 2
    MaxCrashes     = 0
    CheckInSlot    = FALSE
    BindProducers  = TRUE
    SealBeforeIdle = TRUE
    SealOnRevoke   = TRUE

SYMMETRY Sym

INVARIANT EpochsDoNotInterleave

CONSTRAINT StateConstraint
