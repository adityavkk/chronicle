\* Non-vacuity witness W10 (1x2 instance).  TLC reports a counterexample iff
\* WindowW10 is REACHABLE (a delayed seal lands STALE against the successor's
\* marker and mutates nothing); the trace is the witness.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    Auths   = {a1}
    MaxGen          = 3
    MaxSeq          = 2
    MaxCrashes      = 1
    CheckInSlot     = TRUE
    BindProducers   = TRUE
    SealBeforeIdle  = TRUE
    SealOnRevoke    = TRUE
    SealKeyedByAuth = TRUE
SYMMETRY Sym
INVARIANT NotW10
CONSTRAINT StateConstraint
