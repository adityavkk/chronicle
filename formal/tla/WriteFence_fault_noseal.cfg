\* FAULT-INJECTION config (INV-FENCE-05/06 negative test, K.4: the delayed
\* grant past a reaped tombstone). SealOnRevoke = FALSE makes done only
\* tombstone the marker (today's revoke_append_fence.lua) and never record the
\* per-authority seal. Once the tombstone is reaped, a grant EVAL from the
\* deposed holder's old snapshot (its lease still unexpired) finds no marker
\* and no seal, reinstalls the old generation's marker, and the deposed
\* holder's late append lands after the successor's. This MUST produce an
\* EpochsDoNotInterleave counterexample whose trace contains DelayedGrant.
\* Faithful runs use SealOnRevoke = TRUE.
\* Run: java -cp tla2tools.jar tlc2.TLC -config WriteFence_fault_noseal.cfg MC_WriteFence.tla
SPECIFICATION Spec

CONSTANTS
    Workers = {w1, w2}
    Auths   = {a1}
    MaxGen         = 3
    MaxSeq         = 2
    MaxCrashes     = 0
    CheckInSlot    = TRUE
    BindProducers  = TRUE
    SealBeforeIdle = TRUE
    SealOnRevoke   = FALSE

SYMMETRY Sym

INVARIANT EpochsDoNotInterleave

CONSTRAINT StateConstraint
