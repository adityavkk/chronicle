\* Non-vacuity witness W9 (1x2 instance), a STEP witness: NotW9 is the action
\* property [][~ReapedReinstall]_vars, so TLC reports a counterexample iff the
\* heartbeat re-grant (Renew) over a reaped marker is REACHABLE under a live
\* claim; the trace (Claim . MarkerLapse . Reap . Renew) is the witness.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    Auths   = {a1}
    MaxGen          = 3
    MaxSeq          = 2
    MaxCrashes      = 1
    CheckInSlot     = TRUE
    BindProducers   = TRUE
    SealBeforeIdle  = TRUE
    SealOnRevoke    = TRUE
    SealKeyedByAuth = TRUE
SYMMETRY Sym
PROPERTY NotW9
CONSTRAINT StateConstraint
