\* Non-vacuity witness W7 (1x2 instance), a STEP witness: NotW7 is the action
\* property [][~RecoveredIdle]_vars, so TLC reports a counterexample iff the
\* Idle step out of a crash-recovered done sequence is REACHABLE; the trace
\* (Claim . SealMarker . Crash . SealMarker . Idle) is the witness.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    Auths   = {a1}
    MaxGen          = 3
    MaxSeq          = 2
    MaxCrashes      = 1
    CheckInSlot     = TRUE
    BindProducers   = TRUE
    SealBeforeIdle  = TRUE
    SealOnRevoke    = TRUE
    SealKeyedByAuth = TRUE
SYMMETRY Sym
PROPERTY NotW7
CONSTRAINT StateConstraint
