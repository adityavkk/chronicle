\* Non-vacuity witness W7 (1x2 instance).  TLC reports a counterexample iff
\* WindowW7 is REACHABLE; the trace is the witness.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    Auths   = {a1}
    MaxGen         = 3
    MaxSeq         = 2
    MaxCrashes     = 1
    CheckInSlot    = TRUE
    BindProducers  = TRUE
    SealBeforeIdle = TRUE
    SealOnRevoke   = TRUE
SYMMETRY Sym
INVARIANT NotW7
CONSTRAINT StateConstraint
