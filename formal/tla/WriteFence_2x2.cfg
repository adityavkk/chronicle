\* TLC config: 2 authorities x 2 workers on ONE fenced stream (nightly lane).
\* Two subscriptions linked to the same stream carry two markers and two seals
\* (wfseal:<auth>) but share the producer state and the log; this run checks
\* the per-authority invariants under the cross-authority interleaving. (It
\* cannot falsify SealIsolation by itself: WriteFence_fault_globalseal.cfg is
\* that invariant's negative control.)
\* Run: java -cp tla2tools.jar tlc2.TLC -config WriteFence_2x2.cfg MC_WriteFence.tla
SPECIFICATION Spec

CONSTANTS
    Workers = {w1, w2}
    Auths   = {a1, a2}
    MaxGen          = 2
    MaxSeq          = 1
    MaxCrashes      = 1
    CheckInSlot     = TRUE
    BindProducers   = TRUE
    SealBeforeIdle  = TRUE
    SealOnRevoke    = TRUE
    SealKeyedByAuth = TRUE

SYMMETRY Sym

INVARIANT Inv

PROPERTY
    GenMonotoneProp
    SealedIsFinalProp

CONSTRAINT StateConstraint
