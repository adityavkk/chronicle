\* FAULT-INJECTION config (SealIsolation negative test: the generation-only
\* seal the design rejected, Q5). SealKeyedByAuth = FALSE replaces the
\* per-authority wfseal:<auth> field with one stream-global seal, so a done by
\* the first authority's holder seals the SECOND authority at a generation it
\* never reached: its seal runs ahead of its fence register and its next
\* claim is refused (the recreated / second subscription is bricked). This
\* MUST produce a SealIsolation counterexample on two authorities, proving
\* the per-authority key is load-bearing. Faithful runs use
\* SealKeyedByAuth = TRUE. MaxCrashes = 0: the hole needs no crash.
\* Run: java -cp tla2tools.jar tlc2.TLC -config WriteFence_fault_globalseal.cfg MC_WriteFence.tla
SPECIFICATION Spec

CONSTANTS
    Workers = {w1, w2}
    Auths   = {a1, a2}
    MaxGen          = 2
    MaxSeq          = 1
    MaxCrashes      = 0
    CheckInSlot     = TRUE
    BindProducers   = TRUE
    SealBeforeIdle  = TRUE
    SealOnRevoke    = TRUE
    SealKeyedByAuth = FALSE

SYMMETRY Sym

INVARIANT SealIsolation

CONSTRAINT StateConstraint
