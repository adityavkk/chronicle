# Issue #6 immutable-segment matrix: fixed closed-loop replay concurrency.
name: segment-readers-8
description: 8 concurrent full-stream readers over 16 prefilled 4 MiB streams.
duration: 10s
warmup: 3s
streams:
  count: 16
  prefix: bench/segments/r8
  content_type: application/json
  prefill:
    messages: 4096
    message_bytes: 1024
    batch_size: 128
catchup:
  readers: 8
limits:
  max_in_flight_catchup: 8
  request_timeout: 30s
